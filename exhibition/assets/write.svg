<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-label="Illustration of a collective sentence in an old web browser">
<rect width="1100" height="710" fill="#e5dfd6"/><rect x="72" y="50" width="956" height="609" rx="9" fill="#2b2a2a"/><rect x="80" y="58" width="940" height="593" rx="4" fill="#faf8f1"/><rect x="80" y="58" width="940" height="68" fill="#dad5cc"/><circle cx="113" cy="91" r="10" fill="#f07452"/><circle cx="144" cy="91" r="10" fill="#e9bd63"/><circle cx="175" cy="91" r="10" fill="#93ae7c"/><text x="550" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="19" fill="#3b3634">THE WORLD'S FIRST COLLABORATIVE SENTENCE — 1994</text><rect x="105" y="143" width="890" height="47" rx="2" fill="#f0ece4" stroke="#a4a099"/><text x="128" y="173" font-family="monospace" font-size="18" fill="#76716c">http://a-sentence-that-keeps-growing/</text><rect x="105" y="208" width="890" height="410" fill="#fffefb" stroke="#d7d2c7"/><text x="139" y="248" font-family="monospace" font-size="16" font-weight="bold" fill="#cb593c">PUBLIC WRITING SPACE  /  NO FINAL PERIOD</text><text x="139" y="303" font-family="Georgia,serif" font-size="39" fill="#282522">one person begins and then</text><text x="139" y="357" font-family="Georgia,serif" font-size="47" font-style="italic" fill="#b75e46">another person adds</text><text x="139" y="409" font-family="Georgia,serif" font-size="42" fill="#282522">their thoughts and the</text><text x="139" y="461" font-family="Georgia,serif" font-size="45" fill="#282522">sentence keeps moving</text><text x="139" y="514" font-family="Georgia,serif" font-size="47" font-style="italic" fill="#b75e46">from one voice to another</text><text x="139" y="569" font-family="Georgia,serif" font-size="44" fill="#282522">and then someone else <tspan fill="#e46c4c">|</tspan></text><text x="885" y="603" font-family="monospace" font-size="13" fill="#8b847c">ENDLESS →</text></svg>